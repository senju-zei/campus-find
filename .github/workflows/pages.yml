# Publishes the staff dashboard (web/) to GitHub Pages: https://senju-zei.github.io/campus-find/
# One-time setup: repository Settings > Pages > Source: GitHub Actions.
name: pages

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stop if the Firebase web config was not filled in
        run: |
          if grep -q "PASTE_WEB_" web/config.js; then
            echo "::error::Fill in apiKey and appId in web/config.js (Firebase console > Project settings > Your apps > Web app)."
            exit 1
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deployment
        uses: actions/deploy-pages@v4
