# Builds Campus Find on every push to main and publishes the APK to the Release tagged "latest".
# Tiers 0 and 1 of the QA plan run here (build, lint, unit tests). Step 7 adds tier 2 (rules
# tests in the Firebase emulator) to this file; a failure in any tier blocks the release.
name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Write google-services.json from secret
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "::error::Repository secret GOOGLE_SERVICES_JSON is not set."
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Tier 0 and 1 (build, lint, unit tests)
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace

      - name: Upload lint and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: app/build/reports/
          if-no-files-found: ignore

      - name: Publish APK to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub sometimes answers the delete with HTTP 500; retry until the old release is gone.
          for attempt in 1 2 3; do
            gh release view latest > /dev/null 2>&1 || break
            gh release delete latest --yes --cleanup-tag || sleep 10
          done
          gh release create latest app/build/outputs/apk/debug/campus-find.apk \
            --target "$GITHUB_SHA" \
            --title "Campus Find (latest build)" \
            --notes "Debug build of commit ${GITHUB_SHA::7}. On your phone: download campus-find.apk, allow your browser to install unknown apps, then tap Install. If Play Protect warns, choose Install anyway."
